# Dataset config. Class ids MUST match Label Studio's classes.txt (export order).
# Augmentation is NOT configured here: Ultralytics ignores those keys in a dataset
# YAML. See train.py, which passes them to model.train() and writes an absolute-path
# cells.runtime.yaml for the current machine.
#
# If you run `yolo train data=cells.yaml` directly, uncomment and edit `path`:
# path: /absolute/path/to/AIMLProject/dataset
train: images/train_split
val: images/val_split

names:
  0: Adhered Multiplets
  1: Adhered Singlets
  2: Debris
  3: Suspended Multiplets
  4: Suspended Singlets
