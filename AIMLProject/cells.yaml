path: /home/hice1/jisaacson7/scratch/CHBE4803/CHBE4803_Microscopy_Cell_Classification/AIMLProject/dataset # This must be an absolute path
train: images/train_split
val: images/val_split

# Classes
names:
  0: Adhered Singlets
  1: Suspended Multiplets
  2: Debris
  3: Suspended Singlets
  4: Adhered Multiplets

# Data Augmentation
augment: True     # Enable augmentation
# Color & Lighting (Tailored for Brightfield)
hsv_h: 0.0         # DESTROY HUE SHIFTING. Brightfield images do not have color channels.
hsv_s: 0.0         # DESTROY SATURATION. Keeps the model from looking for color saturation.
hsv_v: 0.3         # Keep at 0.3. This simulates changes in the microscope lamp brightness.

# Contrast & Clarity (Add if using custom hyp profiles)
clahe: 0.5         # Highly recommended for brightfield. Automatically normalizes 
                   # low-contrast cell boundaries against a bright background.

# Geometry (Full orientation freedom)
degrees: 180.0     # Full 360-degree rotation.
flipud: 0.5        # Vertical flips.
fliplr: 0.5        # Horizontal flips.
mosaic: 1.0        # Stays at 1.0. Forces the model to locate cells at different scales.

